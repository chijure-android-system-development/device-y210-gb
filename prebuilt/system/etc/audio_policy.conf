# Audio policy configuration for the Huawei Y210 (MSM7x27A).
#
# This file was entirely absent from /system/etc on this device (also never
# present in the CM9-era tree this was ported from), so AudioPolicyManagerBase
# fell back to its hardcoded defaultAudioPolicyConfig() -- a single rigid
# output profile (44100/STEREO/PCM16/SPEAKER) and a single rigid input
# profile (8000/MONO/PCM16/BUILTIN_MIC). Output happened to keep working off
# that fallback, but AudioRecord (mic) consistently failed with
# "getInput() could not find profile for device ..., samplingRate 8000,
# format ..., channelMask ..." for ordinary MIC-source recording -- the
# fallback's single-value profile wasn't matching real app requests.
#
# Broadened here (based on the equivalent JB config from the Huawei G300,
# same MSM7x27A SoC) to accept the range of sampling rates/channel masks a
# real recording app is likely to request, without the LPA/VOIP-direct-output
# or A2DP module blocks that this device's simpler ported AudioHardware.cpp
# almost certainly doesn't implement.

global_configuration {
  attached_output_devices AUDIO_DEVICE_OUT_SPEAKER|AUDIO_DEVICE_OUT_EARPIECE
  default_output_device AUDIO_DEVICE_OUT_SPEAKER
  attached_input_devices AUDIO_DEVICE_IN_BUILTIN_MIC
}

audio_hw_modules {
  primary {
    outputs {
      primary {
        sampling_rates 44100
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_SPEAKER|AUDIO_DEVICE_OUT_EARPIECE|AUDIO_DEVICE_OUT_WIRED_HEADSET|AUDIO_DEVICE_OUT_WIRED_HEADPHONE|AUDIO_DEVICE_OUT_ALL_SCO
        flags AUDIO_OUTPUT_FLAG_PRIMARY
      }
    }
    inputs {
      primary {
        sampling_rates 8000|11025|16000|22050|32000|44100
        channel_masks AUDIO_CHANNEL_IN_MONO|AUDIO_CHANNEL_IN_VOICE_CALL_MONO|AUDIO_CHANNEL_IN_VOICE_DNLINK_MONO|AUDIO_CHANNEL_IN_VOICE_UPLINK_MONO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_IN_BUILTIN_MIC|AUDIO_DEVICE_IN_WIRED_HEADSET|AUDIO_DEVICE_IN_VOICE_CALL|AUDIO_DEVICE_IN_BLUETOOTH_SCO_HEADSET
      }
    }
  }
}
